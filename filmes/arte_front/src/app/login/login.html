<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Acesso ao Sistema</h3>

    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Usuário ou E-mail</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Digite seu e-mail"
          required
        />
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input
          type="password"
          class="form-control"
          id="senha"
          placeholder="Digite sua senha"
          required
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="lembrar"
          />
          <label class="form-check-label" for="lembrar">
            Lembrar-me
          </label>
        </div>
        <a href="#" class="small text-decoration-none">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Entrar
      </button>
    </form>

    <div class="text-center mt-3">
      <p class="small mb-0">Não tem uma conta?
        <a href="#" class="text-decoration-none">Cadastre-se</a>
      </p>
    </div>
  </div>
</div>
